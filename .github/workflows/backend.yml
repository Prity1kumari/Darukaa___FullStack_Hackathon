name: Backend CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test-and-lint:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: darukaa_user
          POSTGRES_PASSWORD: darukaa_password
          POSTGRES_DB: darukaa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: ruff check . --exit-zero

      - name: Run Ruff Format Check
        run: ruff format --check . || true

      - name: Run Pytest
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://darukaa_user:darukaa_password@localhost:5432/darukaa_test
          SECRET_KEY: test-secret-key-at-least-32-chars-long-darukaa
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_DAYS: 7
        run: pytest
