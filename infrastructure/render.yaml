# Render Blueprint Specification for Darukaa.Earth
version: "1"

services:
  # Backend FastAPI Web Service
  - type: web
    name: darukaa-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-postgis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: BACKEND_CORS_ORIGINS
        value: "https://darukaa.earth,https://*.vercel.app"

  # Frontend Static Site (or deployed on Vercel)
  - type: web
    name: darukaa-frontend
    env: static
    region: oregon
    plan: starter
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: "frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: darukaa-backend
          type: web
          property: host
      - key: VITE_MAPBOX_ACCESS_TOKEN
        sync: false

databases:
  # Managed PostgreSQL with PostGIS
  - name: darukaa-postgis
    region: oregon
    plan: starter
    postgresMajorVersion: 16
    ipAllowList: []
